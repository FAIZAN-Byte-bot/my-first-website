
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan Gaming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080817;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px 15px;
            background: #10102b;
            border-bottom: 2px solid #6845ff;
        }

        h1 {
            color: #00d9ff;
            text-shadow: 0 0 15px #00d9ff;
            font-size: 32px;
        }

        .hero {
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 35px;
            color: #a879ff;
            text-shadow: 0 0 15px #813cff;
            margin-bottom: 15px;
        }

        .hero p {
            color: #c5c5df;
            font-size: 17px;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: linear-gradient(90deg, #00cfff, #853cff);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 0 20px #673cff;
        }

        .about {
            padding: 35px 20px;
            background: #11112a;
            margin: 20px;
            border: 1px solid #6944ff;
            border-radius: 15px;
        }

        footer {
            padding: 25px;
            color: #9999bb;
        }
    </style>
</head>

<body>

    <header>
        <h1>FAIZAN GAMING</h1>
    </header>

    <section class="hero">
        <h2>WELCOME TO MY WORLD</h2>
        <p>
            Hey! I am Faizan.<br>
            I am a Free Fire player.<br>
            Welcome to my gaming website!
        </p>

        <a href="#about" class="btn">EXPLORE MORE</a>
    </section>

    <section class="about" id="about">
        <h2>ABOUT ME</h2>
        <p>
            Gaming is my passion.<br>
            I love playing games and learning technology.
        </p>
    </section>

    <footer>
        © 2026 Faizan Gaming
    </footer>

</body>
</html>
